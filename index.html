          <h1>St.GeoARgen – AR-Stadtrundgang durch St. Georgen im Schwarzwald</h1>
          <p>
            St.GeoARgen ist ein interaktiver Augmented-Reality-Stadtrundgang durch St. Georgen im Schwarzwald.
            Mit dem Smartphone erkundest du fünf Stationen zu Geschichte, Kultur und Natur, sammelst Punkte
            und löst Gutscheine bei lokalen Partnern ein. Bitte aktiviere JavaScript, um die App zu nutzen.
          </p>
          <h2>Die Stationen des Themenpfads</h2>
          <ul>
            <li><a href="/glockenspiel">Glockenspiel</a> – komponiere deine eigene Melodie in AR</li>
            <li><a href="/bahnhof">Bahnhof</a> – die Geschichte des Bahnhofs St. Georgen</li>
            <li><a href="/phonomuseum">Phonomuseum</a> – Audiomedien und Phonoindustrie in AR</li>
            <li><a href="/schwarzes-tor">Schwarzes Tor</a> – 360°-Zeitreise durch historische Räume</li>
            <li><a href="/klosterweiher">Klosterweiher</a> – Natur und Tierwelt am Weiher</li>
          </ul>
          <p>

          </p>
          <p>Ein Studienprojekt des IIIUS Instituts der Hochschule Furtwangen University in Kooperation mit der Stadt St. Georgen.</p>
